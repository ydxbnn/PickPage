format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  primary:
    description: "Build the React Native APK"
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone: {}
    - script:
        title: Install dependencies and Prebuild Expo
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            npm ci --no-audit --no-fund
            npx expo prebuild --platform android --no-install
    - script:
        title: Build APK with Gradle
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
    - script:
        title: Copy APK
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            mkdir -p $BITRISE_DEPLOY_DIR
            cp android/app/build/outputs/apk/release/*.apk $BITRISE_DEPLOY_DIR/
    - deploy-to-bitrise-io@2: {}
